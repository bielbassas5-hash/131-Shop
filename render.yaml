services:
  - type: web
    name: tienda-131
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: SHIPPING_COST_CENTS
        value: "350"
      - key: SHIPPING_COUNTRIES
        value: ES
      # Secretos y datos propios: se rellenan en el panel de Render
      - key: ADMIN_PASSWORD
        sync: false
      - key: BIZUM_PHONE
        sync: false
      - key: BANK_IBAN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_NIF
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LEAD_TIME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
